<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Padlet Live Canvas · GitHub Pages Edition</title>
  
  <!-- Lightweight WebSockets PubSub Engine for Multi-Device Real-Time Sync -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

  <style>
    :root {
      --bg-canvas: #090d16;
      --grid-dot: #1e293b;
      --surface: #0f172a;
      --surface-card: #1e293b;
      --surface-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --green: #10b981;
      --danger: #ef4444;
      --amber: #f59e0b;
      --radius: 12px;
      --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
      --shadow-drag: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', Consolas, monospace;
    }

    /* Note Color Themes */
    .theme-yellow { --card-bg: #fef08a; --card-text: #713f12; --card-accent: #eab308; --card-border: #fde047; }
    .theme-blue   { --card-bg: #bae6fd; --card-text: #0c4a6e; --card-accent: #0284c7; --card-border: #7dd3fc; }
    .theme-green  { --card-bg: #bbf7d0; --card-text: #14532d; --card-accent: #16a34a; --card-border: #86efac; }
    .theme-pink   { --card-bg: #fbcfe8; --card-text: #831843; --card-accent: #db2777; --card-border: #f472b6; }
    .theme-purple { --card-bg: #e9d5ff; --card-text: #581c87; --card-accent: #9333ea; --card-border: #d8b4fe; }
    .theme-dark   { --card-bg: #1e293b; --card-text: #f8fafc; --card-accent: #60a5fa; --card-border: #475569; }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      font-family: var(--font-sans); background: var(--bg-canvas); color: var(--text-main);
    }

    /* ── Top Bar ── */
    header.app-bar {
      position: fixed; top: 0; left: 0; right: 0; height: 60px;
      background: rgba(15, 23, 42, 0.90); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--surface-border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; z-index: 1000; gap: 10px;
    }
    .brand-section { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .board-title {
      font-size: 15px; font-weight: 700; color: #fff; background: transparent;
      border: 1px solid transparent; border-radius: 6px; padding: 4px 8px;
      outline: none; max-width: 180px; text-overflow: ellipsis; white-space: nowrap;
    }
    .board-title:focus { background: var(--surface-card); border-color: var(--surface-border); }

    /* Live Room Status Pill */
    .room-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(30, 41, 59, 0.8); border: 1px solid var(--surface-border);
      padding: 4px 10px; border-radius: 20px; font-size: 11.5px; font-family: var(--font-mono);
      cursor: pointer;
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--amber);
      animation: pulse 1.8s infinite;
    }
    .status-dot.connected { background: var(--green); box-shadow: 0 0 8px var(--green); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    .nav-actions { display: flex; align-items: center; gap: 8px; }

    /* Identity Pill */
    .identity-pill {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface-card); border: 1px solid var(--surface-border);
      padding: 4px 10px; border-radius: 30px; font-size: 12.5px; cursor: pointer;
    }
    .avatar-circle {
      width: 24px; height: 24px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-size: 11px;
      font-weight: 700; color: #fff; background: #64748b;
    }

    .btn {
      background: var(--surface-card); border: 1px solid var(--surface-border);
      color: var(--text-main); font-size: 12.5px; font-weight: 600;
      padding: 6px 12px; border-radius: 8px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
      transition: all 0.15s;
    }
    .btn:hover { background: #334155; border-color: #64748b; }
    .btn.primary { background: var(--primary); border-color: #60a5fa; color: #fff; }
    .btn.primary:hover { background: var(--primary-hover); }

    /* ── Canvas Viewport ── */
    .canvas-viewport {
      width: 100vw; height: 100vh; position: absolute; top: 0; left: 0;
      overflow: hidden; cursor: grab; user-select: none;
      background-image: radial-gradient(var(--grid-dot) 1.5px, transparent 1.5px);
      background-size: 32px 32px;
    }
    .canvas-viewport.panning { cursor: grabbing; }

    .canvas-world {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; transform-origin: 0 0;
      pointer-events: none;
    }

    /* ── Sticky Note Card ── */
    .note-card {
      position: absolute; width: 280px; min-height: 160px;
      background: var(--card-bg); color: var(--card-text);
      border-radius: var(--radius); border: 1px solid var(--card-border);
      box-shadow: var(--shadow-card); padding: 16px;
      pointer-events: auto; cursor: default;
      display: flex; flex-direction: column; gap: 10px;
      transform-origin: center center;
      transition: box-shadow 0.2s, transform 0.1s;
      z-index: 10;
    }
    .note-card.dragging {
      box-shadow: var(--shadow-drag); cursor: grabbing; z-index: 9999;
      transform: scale(1.03) rotate(1deg); opacity: 0.95;
    }
    .card-header {
      display: flex; align-items: center; justify-content: space-between;
      cursor: grab; padding-bottom: 4px;
    }
    .card-header .author-tag {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px;
      opacity: 0.85;
    }
    .card-header .author-dot {
      width: 8px; height: 8px; border-radius: 50%; background: currentColor;
    }
    .btn-icon {
      background: transparent; border: none; color: inherit; cursor: pointer;
      opacity: 0.6; border-radius: 4px; padding: 2px 4px; font-size: 14px;
    }
    .btn-icon:hover { opacity: 1; background: rgba(0, 0, 0, 0.08); }

    .card-title {
      font-size: 16px; font-weight: 700; line-height: 1.3;
      outline: none; word-break: break-word;
    }
    .card-title:empty:before { content: "Note Title..."; opacity: 0.45; }

    .card-body {
      font-size: 13.5px; line-height: 1.5; outline: none;
      word-break: break-word; min-height: 60px; flex: 1;
    }
    .card-body:empty:before { content: "Type your ideas or links..."; opacity: 0.45; }

    .card-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 8px; border-top: 1px solid rgba(0, 0, 0, 0.08);
      font-size: 12px;
    }
    .like-btn {
      background: rgba(0, 0, 0, 0.05); border: none; border-radius: 20px;
      padding: 3px 8px; font-size: 11.5px; font-weight: 600; color: inherit;
      cursor: pointer; display: flex; align-items: center; gap: 4px;
    }
    .like-btn.liked { color: var(--danger); background: rgba(239, 68, 68, 0.15); }

    .palette-row { display: flex; gap: 4px; align-items: center; }
    .color-dot {
      width: 14px; height: 14px; border-radius: 50%; cursor: pointer;
      border: 1px solid rgba(0, 0, 0, 0.2);
    }
    .color-dot:hover { transform: scale(1.25); }

    /* ── Floating Controls ── */
    .hud-controls {
      position: fixed; bottom: 24px; right: 24px;
      display: flex; flex-direction: column; gap: 10px; z-index: 1000;
    }
    .fab-add {
      width: 54px; height: 54px; border-radius: 50%;
      background: var(--primary); color: #fff; border: 2px solid #60a5fa;
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.5); font-size: 26px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: transform 0.2s;
    }
    .fab-add:hover { transform: scale(1.08) rotate(90deg); }

    .zoom-toolbar {
      position: fixed; bottom: 24px; left: 24px;
      background: var(--surface); border: 1px solid var(--surface-border);
      border-radius: 30px; padding: 4px 10px; display: flex; align-items: center;
      gap: 8px; box-shadow: var(--shadow-card); z-index: 1000;
    }
    .zoom-btn {
      background: none; border: none; color: var(--text-main); font-size: 16px;
      width: 26px; height: 26px; cursor: pointer; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .zoom-val { font-size: 11px; font-family: var(--font-mono); min-width: 44px; text-align: center; }

    /* ── Modals ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px); display: none; align-items: center;
      justify-content: center; z-index: 2000;
    }
    .modal-overlay.open { display: flex; }
    .modal-card {
      background: var(--surface); border: 1px solid var(--surface-border);
      width: 90%; max-width: 440px; border-radius: 16px; padding: 24px;
      box-shadow: var(--shadow-drag); display: flex; flex-direction: column; gap: 16px;
    }
    .modal-header { font-size: 17px; font-weight: 700; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .form-input {
      background: #090d16; border: 1px solid var(--surface-border); border-radius: 8px;
      padding: 10px; color: #fff; font-size: 14px; outline: none;
    }
    .form-input:focus { border-color: var(--primary); }

    /* Switch toggle */
    .toggle-row { display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
    .switch { position: relative; width: 44px; height: 24px; display: inline-block; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0; background-color: #334155;
      transition: .3s; border-radius: 24px;
    }
    .slider:before {
      position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(20px); }

    /* Toast */
    .toast-msg {
      position: fixed; top: 72px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95); border: 1px solid var(--primary);
      padding: 8px 18px; border-radius: 20px; font-size: 12.5px; font-weight: 600;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5); z-index: 3000;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .toast-msg.show { opacity: 1; }

    /* QR Code Container */
    .qr-box {
      background: #fff; padding: 14px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      margin: 8px auto; width: 190px; height: 190px;
    }
    .qr-box img { width: 160px; height: 160px; display: block; }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="app-bar">
    <div class="brand-section">
      <span style="font-size:20px;">📌</span>
      <input type="text" class="board-title" id="boardTitle" value="Live Class Board" title="Click to rename board">
      
      <!-- Live Sync Room Status -->
      <div class="room-badge" id="btnChangeRoom" title="Click to switch live room">
        <span class="status-dot" id="syncDot"></span>
        <span id="roomLabel">room: default</span>
      </div>
    </div>

    <div class="nav-actions">
      <!-- Identity Switcher (Anonymous vs Named) -->
      <div class="identity-pill" id="identityTrigger" title="Switch between Anonymous and Name">
        <div class="avatar-circle" id="userAvatar">👤</div>
        <span id="userNameDisplay">Anonymous</span>
      </div>

      <button class="btn" id="btnInvite" title="Scan QR Code or copy link for phone/laptop">📱 Live Invite</button>
      <button class="btn" id="btnOrganize" title="Snap into organized rows">Auto-Grid</button>
      <button class="btn primary" id="btnNewNote">+ Note</button>
    </div>
  </header>

  <!-- Infinite Canvas -->
  <main class="canvas-viewport" id="viewport">
    <div class="canvas-world" id="world"></div>
  </main>

  <!-- Zoom Floating HUD -->
  <div class="zoom-toolbar">
    <button class="zoom-btn" id="zoomOut">−</button>
    <span class="zoom-val" id="zoomDisplay">100%</span>
    <button class="zoom-btn" id="zoomIn">+</button>
    <button class="zoom-btn" id="zoomReset">↺</button>
  </div>

  <div class="hud-controls">
    <button class="fab-add" id="fabAdd" title="Create note at center">+</button>
  </div>

  <!-- Modal: Identity Switcher -->
  <div class="modal-overlay" id="identityModal">
    <div class="modal-card">
      <div class="modal-header">Posting Identity</div>
      <div class="toggle-row">
        <span>Post Anonymously</span>
        <label class="switch">
          <input type="checkbox" id="anonToggle" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="form-group" id="nameGroup" style="display:none;">
        <label>Display Name</label>
        <input type="text" class="form-input" id="nameInput" placeholder="e.g. Alice, Dr. Canziani">
      </div>
      <div class="form-group">
        <label>Avatar Color</label>
        <div class="palette-row" style="margin-top:4px;">
          <div class="color-dot" style="background:#3b82f6" data-color="#3b82f6"></div>
          <div class="color-dot" style="background:#10b981" data-color="#10b981"></div>
          <div class="color-dot" style="background:#f59e0b" data-color="#f59e0b"></div>
          <div class="color-dot" style="background:#ec4899" data-color="#ec4899"></div>
          <div class="color-dot" style="background:#8b5cf6" data-color="#8b5cf6"></div>
          <div class="color-dot" style="background:#64748b" data-color="#64748b"></div>
        </div>
      </div>
      <button class="btn primary" style="justify-content:center;" id="sav
